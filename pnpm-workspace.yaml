packages:
  - apps/*
  - packages/*

# Control 10: third-party releases must be at least 7 days old. The platform's own packages are
# exempt: they are reviewed and published by the platform team.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@solidvs/*'

# No dependency runs install scripts unless allowed here. The Prisma CLI fetches its schema engine on
# first use (build and migration image only, ADR-0016) and needs no install script.
allowBuilds:
  '@prisma/engines': false
  '@swc/core': false
  esbuild: false
  prisma: false

# Reviewed overrides of transitive dependencies, each with its reason; remove when the parent
# package ships the fix.
overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS, high): @prisma/config 7.10.1 pins effect 3.20.0; 3.22.4 is the
  # newest patched release older than 7 days, same major version. Prisma CLI only (ADR-0016).
  'effect@<3.22.1': 3.22.4
